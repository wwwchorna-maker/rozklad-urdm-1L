<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад пар</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .week-status {
            display: inline-block;
            background: #4a90e2;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }
        
        /* Кнопка перемикання тижня */
        .toggle-btn {
            display: block;
            margin: 0 auto 15px auto;
            background: white;
            color: #2c3e50;
            border: 2px solid #2c3e50;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9em;
        }
        .toggle-btn:hover {
            background: #2c3e50;
            color: white;
        }

        /* Віджет реального часу */
        .live-widget {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 2px solid #e1e8ed;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .live-widget.active {
            border-color: #4cd137;
            background: #f1fcf0;
            box-shadow: 0 0 15px rgba(76, 209, 55, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 209, 55, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(76, 209, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 209, 55, 0); }
        }

        /* Кнопки днів тижня (Таби) */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            background: #e1e8ed;
            color: #555;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #2c3e50;
            color: white;
            box-shadow: 0 4px 8px rgba(44, 62, 80, 0.3);
        }

        /* Картки пар */
        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #ccc;
        }
        .card.lecture { border-left-color: #d1c4e9; background-color: #f5f2fa; }
        .card.practice { border-left-color: #a8e6cf; background-color: #f0fbf7; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .time { font-weight: bold; color: #555; }
        .type { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: #777; }
        .subject { font-size: 1.1em; font-weight: bold; margin: 0 0 10px 0; }
        .location { font-weight: bold; color: #2c3e50; }
        
        /* Стилі для кількох посилань */
        .links-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .link-btn {
            display: inline-block;
            background: #2c3e50;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .links-container .link-btn {
            margin-top: 0;
        }
        details {
            margin-top: 10px;
            background: rgba(0,0,0,0.03);
            padding: 10px;
            border-radius: 5px;
        }
        summary { cursor: pointer; font-weight: bold; color: #4a90e2; }
        .empty-state { text-align: center; color: #777; padding: 30px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Розклад ЮРДМ-1Лс</h1>
        <div class="week-status" id="weekStatus">Завантаження...</div>
        
        <!-- Кнопка перемикання -->
        <button id="weekToggleBtn" class="toggle-btn" onclick="toggleWeek()">Завантаження...</button>
        
        <!-- Віджет поточного стану -->
        <div id="liveWidget" class="live-widget">
            Завантаження даних про пари...
        </div>
    </div>

    <!-- Кнопки днів -->
    <div class="tabs" id="dayTabs"></div>

    <!-- Контейнер для карток пар -->
    <div id="scheduleContainer"></div>

    <script>
        // --- 1. БАЗА ДАНИХ РОЗКЛАДУ ---
        const scheduleData = [
            // ПОНЕДІЛОК
            { day: 'Понеділок', pairNum: '4 пара', type: 'lecture', typeName: 'Лекція', time: '13:30 - 14:50', subject: 'Реалізація і захист прав, свобод та інтересів особи у відносинах з публічною адміністрацією', teacher: 'проф. Школик Андрій Михайлович, доц. Кузьмич Владислав Володимирович, доц. Шандра Роман Станіславович', control: 'Іспит: письмова форма (позовна заява)', link:'#', week: 'numerator' },
            { day: 'Понеділок', pairNum: '4 пара', type: 'lecture', typeName: 'Лекція', time: '13:30 - 14:50', subject: 'Правові цінності, міжнародні стандарти та медіація у професійній діяльності юриста', teacher: 'проф. Бойко І. Й., доц. Федущак-Паславська Г.М., доц. Олійник Ю.В.', control: 'Іспит: усна форма', link: '#', week: 'denominator' },
            { day: 'Понеділок', pairNum: '5 пара', type: 'lecture', typeName: 'Лекція', time: '15:05 - 16:25', subject: 'Соціально-правові стандарти захисту прав та інтересів громадян в умовах глобалізації ринку праці', teacher: 'проф. Бурак В. Я., доц. Кульчицька О. І., доц. Ласько І. М.', control: 'Іспит: усна форма', link: '#', week: 'numerator' },
            { day: 'Понеділок', pairNum: '5 пара', type: 'lecture', typeName: 'Лекція', time: '15:05 - 16:25', subject: 'Конституційні цінності та їх реалізація в Україні', teacher: 'проф. Бориславська О. М., доц. Мочульська М. Є.', control: 'Іспит: усна форма', link: '#', week: 'denominator' },
            { day: 'Понеділок', pairNum: '6 пара', type: 'lecture', typeName: 'Лекція', time: '16:40 - 18:00', subject: 'Теоретико-прикладні засади юридичної діяльності', teacher: 'проф. Косович В. М., проф. Раданович Н. М., д.ю.н. Настасяк І. Ю., доц. Ничка Ю. В., доц. Лубчук О. Д., к.ю.н. Маленевський А. О., проф. Дудаш Т. І.', control: 'Іспит: письмова форма (тести)', link: '#', week: 'denominator' },

            // СЕРЕДА
            { day: 'Середа', pairNum: '5 пара', type: 'lecture', typeName: 'Лекція', time: '15:05 - 16:25', subject: 'ВНД Практикум з договірного права в IT сфері', teacher: 'доц. Суханов М. О.', control: 'Залік', link: '#', week: 'numerator' },
            { day: 'Середа', pairNum: '5 пара', type: 'practice', typeName: 'Практичне', time: '15:05 - 16:25', subject: 'ВНД Практикум з договірного права в IT сфері', teacher: 'доц. Суханов М. О.', control: 'Залік', link: '#', week: 'denominator' },
            { day: 'Середа', pairNum: '6 пара', type: 'lecture', typeName: 'Практичне', time: '16:40 - 18:00', subject: 'ВНД Доменні спори', teacher: 'к.ю.н. Фірман Д. І.', control: 'Залік', link: '#', week: 'numerator' },
            { day: 'Середа', pairNum: '6 пара', type: 'practice', typeName: 'Лекція', time: '16:40 - 18:00', subject: 'ВНД Доменні спори', teacher: 'доц. Тарасенко Л. Л.', control: 'Залік', link: '#', week: 'denominator' },
            { day: 'Середа', pairNum: '7 пара', type: 'lecture', typeName: 'Лекція', time: '18:10 - 19:30', subject: 'ВНД Політика конфіденційності та право', teacher: 'доц. Самагальська Ю. Я.', control: 'Залік', link: '#', week: 'numerator' },
            { day: 'Середа', pairNum: '7 пара', type: 'practice', typeName: 'Практичне', time: '18:10 - 19:30', subject: 'ВНД Політика конфіденційності та право', teacher: 'доц. Самагальська Ю. Я.', control: 'Залік', link: '#', week: 'denominator' },

            // ЧЕТВЕР
            { day: 'Четвер', pairNum: '3 пара', type: 'practice', typeName: 'Практичне', time: '11:50 - 13:10', subject: 'Реалізація і захист прав, свобод та інтересів особи у відносинах з публічною адміністрацією', teacher: 'к.ю.н. Панасюк К. Т.', control: 'Іспит: письмова форма', auditorium: 'ауд. 511', week: 'denominator' },
            { day: 'Четвер', pairNum: '4 пара', type: 'practice', typeName: 'Практичне', time: '13:30 - 14:50', subject: 'Теоретико-прикладні засади юридичної діяльності', teacher: 'проф. Дудаш Т. І.', control: 'Іспит: усна форма', auditorium: 'ауд. 110', week: 'all' },
            { day: 'Четвер', pairNum: '5 пара', type: 'practice', typeName: 'Практичне', time: '15:05 - 16:25', subject: 'Конституційні цінності та їх реалізація в Україні', teacher: 'проф. Рабінович С. П.', control: 'Іспит: усна форма', auditorium: 'ауд. 513', week: 'numerator' },
            { day: 'Четвер', pairNum: '5 пара', type: 'practice', typeName: 'Практичне', time: '16:40 - 18:00', subject: 'Правові цінності, міжнародні стандарти та медіація у професійній діяльності юриста', teacher: 'доц. Гутів Б. І.', control: 'Іспит: усна форма', auditorium: 'ауд. 613', week: 'denominator' },
            { day: 'Четвер', pairNum: '6 пара', type: 'practice', typeName: 'Практичне', time: '16:40 - 18:00', subject: 'Соціально-правові стандарти захисту прав та інтересів громадян в умовах глобалізації ринку праці', teacher: 'доц. Ласько І. М.', control: 'Іспит: письмова форма', auditorium: 'ауд. 202', week: 'all' }
        ];

        // --- 2. ЛОГІКА ЧАСУ ТА ТИЖНЯ ---
        const dayMap = { 'Понеділок': 1, 'Вівторок': 2, 'Середа': 3, 'Четвер': 4, 'П\'ятниця': 5, 'Субота': 6, 'Неділя': 7 };
        
        function getWeekTypeObj(dateObj) {
            const startOfSemester = new Date(dateObj.getFullYear(), 8, 1); 
            const dayOfWeek = startOfSemester.getDay(); 
            const daysToSubtract = dayOfWeek === 0 ? 6 : dayOfWeek - 1; 
            const startMonday = new Date(startOfSemester);
            startMonday.setDate(startMonday.getDate() - daysToSubtract);
            const diffTime = Math.abs(dateObj - startMonday);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            return weekNumber % 2 !== 0 ? 'numerator' : 'denominator';
        }

        let actualWeekType = getWeekTypeObj(new Date()); 
        let displayedWeekType = actualWeekType; 

        function updateWeekUI() {
            const statusEl = document.getElementById('weekStatus');
            const btnEl = document.getElementById('weekToggleBtn');
            
            const actualWeekStr = actualWeekType === 'numerator' ? 'Чисельник' : 'Знаменник';
            const displayedWeekStr = displayedWeekType === 'numerator' ? 'Чисельник' : 'Знаменник';

            if (actualWeekType === displayedWeekType) {
                statusEl.innerText = 'Поточний тиждень: ' + actualWeekStr;
                statusEl.style.backgroundColor = '#4a90e2'; 
                
                const nextWeekStr = actualWeekType === 'numerator' ? 'Знаменник' : 'Чисельник';
                btnEl.innerText = '👉 Подивитися розклад на ' + nextWeekStr;
            } else {
                statusEl.innerText = 'Перегляд: ' + displayedWeekStr;
                statusEl.style.backgroundColor = '#f39c12'; 
                btnEl.innerText = '👈 Повернутися до поточного тижня';
            }
        }

        function toggleWeek() {
            if (displayedWeekType === actualWeekType) {
                displayedWeekType = actualWeekType === 'numerator' ? 'denominator' : 'numerator';
            } else {
                displayedWeekType = actualWeekType;
            }
            updateWeekUI();
            renderSchedule();
        }

        function parseTime(timeStr, dayStr) {
            const [start, end] = timeStr.split(' - ');
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            const dayIdx = dayMap[dayStr];
            return {
                startMins: dayIdx * 24 * 60 + sh * 60 + sm,
                endMins: dayIdx * 24 * 60 + eh * 60 + em
            };
        }

        // --- 3. ВІДЖЕТ РЕАЛЬНОГО ЧАСУ ---
        function updateLiveWidget() {
            const now = new Date();
            let currentDayInt = now.getDay() || 7; 
            const currentMins = currentDayInt * 24 * 60 + now.getHours() * 60 + now.getMinutes();
            
            let activeClasses = scheduleData.filter(c => c.week === 'all' || c.week === actualWeekType)
                .map(c => ({ ...c, ...parseTime(c.time, c.day) }))
                .sort((a, b) => a.startMins - b.startMins);

            let currentClass = activeClasses.find(c => currentMins >= c.startMins && currentMins <= c.endMins);
            const widget = document.getElementById('liveWidget');

            if (currentClass) {
                widget.className = 'live-widget active';
                widget.innerHTML = `<strong>🟢 Зараз іде (${currentClass.pairNum}):</strong><br> ${currentClass.time} — ${currentClass.subject}`;
            } else {
                widget.className = 'live-widget';
                let nextClass = activeClasses.find(c => c.startMins > currentMins);
                
                if (!nextClass) {
                    const nextWeekType = actualWeekType === 'numerator' ? 'denominator' : 'numerator';
                    let nextWeekClasses = scheduleData.filter(c => c.week === 'all' || c.week === nextWeekType)
                        .map(c => ({ ...c, ...parseTime(c.time, c.day) }))
                        .sort((a, b) => a.startMins - b.startMins);
                    nextClass = nextWeekClasses[0]; 
                }

                if (nextClass) {
                    widget.innerHTML = `<strong>⏳ Найближча пара:</strong><br>${nextClass.day}, ${nextClass.pairNum} (${nextClass.time}) — ${nextClass.subject}`;
                } else {
                    widget.innerHTML = `Вільний час! Найближчих пар немає.`;
                }
            }
        }

        // --- 4. НАВІГАЦІЯ ТА ВІДОБРАЖЕННЯ ---
        // Замінив "Вівторок" на "Четвер", бо у твоєму новому розкладі пари в Четвер
        const days = ['Понеділок', 'Середа', 'Четвер'];
        let selectedDay = days[0];

        const todayStr = Object.keys(dayMap).find(key => dayMap[key] === (new Date().getDay() || 7));
        if (days.includes(todayStr)) selectedDay = todayStr;

        function renderTabs() {
            const tabsHtml = days.map(day =>
                `<button class="tab-btn ${day === selectedDay ? 'active' : ''}" onclick="selectDay('${day}')">${day}</button>`
            ).join('');
            document.getElementById('dayTabs').innerHTML = tabsHtml;
        }

        function selectDay(day) {
            selectedDay = day;
            renderTabs();
            renderSchedule();
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = ''; 

            const dayClasses = scheduleData.filter(c => 
                c.day === selectedDay && (c.week === 'all' || c.week === displayedWeekType)
            );

            if (dayClasses.length > 0) {
                let dayHTML = ``;
                dayClasses.forEach(c => {
                    let locationOrLink = '';
                    
                    if (c.links) {
                        let linksHtml = '';
                        c.links.forEach(l => {
                            linksHtml += `<a href="${l.url}" class="link-btn" target="_blank">🎥 Приєднатися (${l.name})</a>`;
                        });
                        locationOrLink = `<div class="links-container">${linksHtml}</div>`;
                    } 
                    else if (c.link) {
                        locationOrLink = `<a href="${c.link}" class="link-btn" target="_blank">🎥 Приєднатися до дзвінка</a>`;
                    } 
                    else if (c.auditorium) {
                        locationOrLink = `<div class="location">📍 ${c.auditorium}</div>`;
                    }

                    dayHTML += `
                        <div class="card ${c.type}">
                            <div class="card-header">
                                <span class="time">🕒 ${c.time} (${c.pairNum})</span>
                                <span class="type">${c.typeName}</span>
                            </div>
                            <h3 class="subject">${c.subject}</h3>
                            ${locationOrLink}
                            <details>
                                <summary>▶ Деталі про предмет</summary>
                                <p><strong>Викладач:</strong> ${c.teacher}</p>
                                <p><strong>Тип контролю:</strong> ${c.control}</p>
                            </details>
                        </div>
                    `;
                });
                container.innerHTML = dayHTML;
            } else {
                container.innerHTML = `<div class="empty-state">У цей день (${selectedDay}) пар за розкладом немає.</div>`;
            }
        }

        // Запуск
        updateWeekUI();
        renderTabs();
        renderSchedule();
        updateLiveWidget();
        setInterval(updateLiveWidget, 60000); 

    </script>
</body>
</html>
